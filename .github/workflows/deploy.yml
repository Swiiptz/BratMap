# Déploiement GitHub Pages : build Vite à chaque push sur main (ou à la demande).
# Configuration Firebase : Settings › Secrets and variables › Actions › onglet « Variables »
# (VITE_FIREBASE_*, VITE_ACCESS_CODE_SHA256…). Sans VITE_FIREBASE_PROJECT_ID, le site part en mode local.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Site de projet servi sous /<dépôt>/ ; un dépôt <compte>.github.io est servi à la racine.
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then BASE=/; else BASE="/${{ github.event.repository.name }}/"; fi
          npx tsc -b && npx vite build --base "$BASE"
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_ACCESS_CODE_SHA256: ${{ vars.VITE_ACCESS_CODE_SHA256 }}
          VITE_ROUTING_URL: ${{ vars.VITE_ROUTING_URL }}
          VITE_ENV_LABEL: ${{ vars.VITE_ENV_LABEL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
