<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>bratMap — Chronique VTM</title>
    <style>
      /* Écran de chargement : affiché avant le JavaScript, retiré par l'application une fois les données prêtes. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 42%, #1a1114 0%, #090d12 60%);
        color: #eef3f5;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        transition:
          opacity 600ms ease,
          visibility 600ms;
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash .splash-inner {
        display: grid;
        justify-items: center;
        gap: 14px;
      }
      #splash svg {
        width: 112px;
        height: 112px;
        filter: drop-shadow(0 0 22px rgba(217, 100, 63, 0.35));
      }
      #splash .rv-wheel {
        transform-box: view-box;
        transform-origin: 32px 36px;
        animation: rv-spin 9s linear infinite;
      }
      #splash .rv-flames path {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: rv-flicker 1.4s ease-in-out infinite alternate;
      }
      #splash .rv-flames path:nth-child(2) {
        animation-delay: -0.5s;
      }
      #splash .rv-flames path:nth-child(3) {
        animation-delay: -0.9s;
      }
      #splash .rv-pupil {
        transform-box: fill-box;
        transform-origin: center;
        animation: rv-blink 4.2s ease-in-out infinite;
      }
      #splash h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      #splash h1 span {
        color: #d9643f;
      }
      #splash p {
        margin: 0;
        font-size: 10px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #8f9ca4;
      }
      #splash .splash-bar {
        width: 140px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      #splash .splash-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #d9643f, #f6d08a);
        animation: rv-load 1.3s ease-in-out infinite;
      }
      @keyframes rv-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes rv-flicker {
        from {
          transform: scaleY(0.82) skewX(-4deg);
          opacity: 0.75;
        }
        to {
          transform: scaleY(1.08) skewX(4deg);
          opacity: 1;
        }
      }
      @keyframes rv-blink {
        0%,
        44%,
        52%,
        100% {
          transform: scaleX(1);
        }
        48% {
          transform: scaleX(3.2) scaleY(0.4);
        }
      }
      @keyframes rv-load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Chargement de bratMap">
      <div class="splash-inner">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="rv-ember" cx="50%" cy="85%" r="75%">
              <stop offset="0" stop-color="#f6d08a" />
              <stop offset=".5" stop-color="#d9643f" />
              <stop offset="1" stop-color="#7d1f26" />
            </radialGradient>
          </defs>
          <g class="rv-flames" fill="url(#rv-ember)">
            <path d="M32 2c3.4 5 6.6 7.6 4.4 13-1-2.2-2.4-3.4-4.4-4.4-2 1-3.4 2.2-4.4 4.4C25.4 9.6 28.6 7 32 2z" />
            <path d="M15 9.5c4.4 1.6 7.8 3.2 7.6 8.4-2-1-3.6-1.2-5.4-1-1-2.2-1.4-4.4-2.2-7.4z" />
            <path d="M49 9.5c-4.4 1.6-7.8 3.2-7.6 8.4 2-1 3.6-1.2 5.4-1 1-2.2 1.4-4.4 2.2-7.4z" />
          </g>
          <g class="rv-wheel" fill="none" stroke="#c9564a" stroke-width="2.2" stroke-linecap="round">
            <circle cx="32" cy="36" r="22" />
            <circle cx="32" cy="36" r="18.6" stroke-width=".8" opacity=".55" />
            <line x1="44.00" y1="36.00" x2="54.00" y2="36.00" />
            <line x1="40.49" y1="44.49" x2="47.56" y2="51.56" />
            <line x1="32.00" y1="48.00" x2="32.00" y2="58.00" />
            <line x1="23.51" y1="44.49" x2="16.44" y2="51.56" />
            <line x1="20.00" y1="36.00" x2="10.00" y2="36.00" />
            <line x1="23.51" y1="27.51" x2="16.44" y2="20.44" />
            <line x1="32.00" y1="24.00" x2="32.00" y2="14.00" />
            <line x1="40.49" y1="27.51" x2="47.56" y2="20.44" />
          </g>
          <path class="rv-eye" d="M20.5 36q11.5-10.5 23 0q-11.5 10.5-23 0z" fill="#140d0f" stroke="#e8c27a" stroke-width="1.6" stroke-linejoin="round" />
          <ellipse class="rv-pupil" cx="32" cy="36" rx="1.9" ry="5.2" fill="#e8c27a" />
        </svg>
        <h1>brat<span>Map</span></h1>
        <p>Chronique · Hauts-de-Seine</p>
        <div class="splash-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
